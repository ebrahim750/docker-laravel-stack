name: ${COMPOSE_PROJECT_NAME:-laravel}

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: runtime
    args:
      PHP_VERSION: ${PHP_VERSION:-8.4}
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: ${COMPOSE_PROJECT_NAME:-laravel}/app:${APP_IMAGE_TAG:-local}
  restart: unless-stopped
  env_file: [.env]
  volumes:
    - .:/var/www/html
    - ./docker/php/php.ini:/usr/local/etc/php/conf.d/99-app.ini:ro
    - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/99-opcache.ini:ro
  networks: [internal]
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage/logs/nginx:/var/log/nginx
      - ${CERT_DIR:-./docker/certs}:/etc/nginx/certs:ro
    networks: [edge, internal]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  queue:
    <<: *app
    restart: unless-stopped
    command: >
      php artisan queue:work
      --queue=${QUEUE_NAMES:-default}
      --sleep=1
      --tries=${QUEUE_TRIES:-3}
      --max-time=3600
      --max-jobs=1000
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  scheduler:
    <<: *app
    restart: unless-stopped
    command: php artisan schedule:work
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' > /dev/null"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      TZ: ${APP_TIMEZONE:-UTC}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/99-app.cnf:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  mysql-data:
  redis-data:

networks:
  edge:
  internal:
    internal: true
