; Application-level PHP settings. OPcache lives in opcache.ini.
expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000
date.timezone = UTC
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
