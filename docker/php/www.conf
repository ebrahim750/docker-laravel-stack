[www]
user = app
group = app

listen = 0.0.0.0:9000
listen.backlog = 511

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; FPM status endpoint, consumed by the container healthcheck.
ping.path = /ping
ping.response = pong
pm.status_path = /status

access.log = /proc/self/fd/2
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
request_terminate_timeout = 120s

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
