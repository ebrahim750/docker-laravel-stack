---
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: validate compose and image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate the rendered compose file
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=$/DB_PASSWORD=ci-password/' .env
          sed -i 's/^DB_ROOT_PASSWORD=$/DB_ROOT_PASSWORD=ci-root-password/' .env
          sed -i 's/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci-password/' .env
          docker compose config --quiet
          echo "compose file renders"

      # This repo is a template: it ships no application of its own, so the image
      # is built against a minimal fixture rather than the repository root.
      - name: Assemble a build context
        run: |
          mkdir -p "$RUNNER_TEMP/ctx"
          cp -r docker "$RUNNER_TEMP/ctx/"
          cp -r fixture/. "$RUNNER_TEMP/ctx/"

      - name: Build the application image
        run: |
          docker build \
            -f "$RUNNER_TEMP/ctx/docker/php/Dockerfile" \
            --target runtime \
            -t laravel/app:ci \
            "$RUNNER_TEMP/ctx"

      - name: Verify PHP extensions are present
        # Asked of PHP itself rather than grepping `php -m`: opcache is listed as
        # "Zend OPcache", which a plain name match misses.
        run: |
          docker run --rm laravel/app:ci php -r '
            $required = ["pdo_mysql", "redis", "intl", "bcmath", "gd", "zip", "pcntl"];
            $missing = array_filter($required, fn ($e) => !extension_loaded($e));
            if ($missing) { fwrite(STDERR, "missing: " . implode(", ", $missing) . PHP_EOL); exit(1); }
            if (!extension_loaded("Zend OPcache")) { fwrite(STDERR, "missing: Zend OPcache" . PHP_EOL); exit(1); }
            echo "all required extensions loaded" . PHP_EOL;
          '

      - name: Validate nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.29-alpine nginx -t
